<!DOCTYPE html>

<body>
<a class="skip-link" href="#main">Skip to main content</a>
<div id="wrap">
  <header class="top">
    <p class="logo">Campus Café</p>
    <nav class="nav" aria-label="Main">
      <ul>

  <h1 class="h">Contact</h1>
  <h2 class="h h-section">Where to find us</h2>
  <address class="contact-details">
    Campus Café<br>
    Example Street 1, 80000 Munich<br>
    Phone: <a href="tel:+498900000000">+49 89 000 000 00</a><br>
    E-mail: <a href="mailto:hello@campus-cafe.example">hello@campus-cafe.example</a>
  </address>
  <iframe src="https://maps.google.com/maps?q=Munich&z=12&output=embed" width="1100" height="320" style="border:0"></iframe>

  <div class="h" style="font-size:24px">Newsletter &amp; reservations</div>
  <form action="https://campus-cafe.example/subscribe" method="get">
    <input type="text" name="name" placeholder="Name"><br><br>
    <input type="text" name="email" placeholder="E-Mail"><br><br>
    <input type="text" name="birthday" placeholder="Birthday"><br><br>
    <input type="text" name="phone" placeholder="Phone"><br><br>
    <textarea name="msg" placeholder="Message"></textarea><br><br>
    <div class="btn2" onclick="this.closest('form').submit()">Send</div>
  </form>
  </main>
  <footer class="foot">
    <ul class="social">

        <a href="#">

      <li>
        <a href="#">
